<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          sidebar:   "#171717",
          main:      "#212121",
          panel:     "#2f2f2f",
          panelHov:  "#3a3a3a",
          border:    "#3a3a3a",
          ink:       "#ececec",
          muted:     "#a0a0a0",
          accent:    "#10a37f",
        },
        fontFamily: {
          body: ['"Inter"', 'sans-serif'],
        },
      },
    },
  }
</script>

<style>
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  textarea::placeholder { color: #8e8ea0; }

  @keyframes blink {
    0%, 80%, 100% { opacity: .2; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  .dot { animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
</style>
</head>

<body class="h-[100dvh] w-screen bg-main text-ink font-body flex overflow-hidden text-[14px]">

  <!-- Mobile backdrop (only visible when sidebar is open on small screens) -->
  <div id="backdrop" class="hidden fixed inset-0 bg-black/60 z-20 md:hidden"></div>

  <!-- ================= Sidebar ================= -->
  <!-- Off-canvas on mobile (fixed, slides in/out); static in-flow on md+ -->
  <aside
    id="sidebar"
    class="fixed md:static inset-y-0 left-0 z-30 w-[260px] shrink-0 bg-sidebar flex flex-col h-full
           -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out"
  >
    <div class="p-3 flex items-center gap-2">
      <button id="newChatBtn" class="flex-1 flex items-center gap-2 rounded-lg border border-border px-3 py-2.5 text-sm hover:bg-panel transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 shrink-0">
          <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
        </svg>
        New chat
      </button>
      <!-- close button, mobile only -->
      <button id="closeSidebar" class="md:hidden p-2 rounded-lg hover:bg-panel transition shrink-0" aria-label="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
          <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 pb-3">
      <p class="text-xs text-muted px-2 pt-2 pb-1.5 font-medium">Today</p>
      <ul id="chatList" class="flex flex-col gap-0.5"></ul>
    </nav>

    <div class="p-3 border-t border-border">
      <div class="flex items-center gap-2 rounded-lg px-2 py-2 hover:bg-panel transition cursor-pointer">
        <div class="h-7 w-7 rounded-full bg-accent flex items-center justify-center text-xs font-semibold shrink-0">A</div>
        <span class="text-sm truncate">Account</span>
      </div>
    </div>
  </aside>

  <!-- ================= Main ================= -->
  <div class="flex-1 flex flex-col h-full min-w-0">

    <!-- Top bar -->
    <header class="flex items-center gap-2 px-3 sm:px-4 py-3 shrink-0">
      <button id="toggleSidebar" class="p-1.5 rounded-md hover:bg-panel transition" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 4v16"/>
        </svg>
      </button>
      <span class="font-medium text-sm">Assistant</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5 text-muted">
        <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </header>

    <!-- Message history -->
    <main id="history" class="flex-1 overflow-y-auto">
      <div id="messages" class="max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex flex-col gap-4 sm:gap-6"></div>
    </main>

    <!-- Composer -->
    <footer class="shrink-0 px-3 sm:px-4 pb-4 sm:pb-6 pt-2">
      <form id="composer" class="max-w-3xl mx-auto">
        <div class="flex items-end gap-1.5 sm:gap-2 bg-panel border border-border rounded-3xl px-3 sm:px-4 py-2 sm:py-2.5 shadow-lg focus-within:border-[#5a5a5a] transition">
          <button type="button" class="p-1.5 rounded-full hover:bg-panelHov transition shrink-0" aria-label="Attach">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 text-muted">
              <path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <textarea
            id="input"
            rows="1"
            placeholder="Message assistant…"
            class="flex-1 resize-none bg-transparent outline-none text-[15px] placeholder:text-muted max-h-40 py-1.5 min-w-0"
          ></textarea>

          <button
            type="submit"
            id="sendBtn"
            class="shrink-0 h-8 w-8 rounded-full bg-white text-black flex items-center justify-center transition disabled:bg-[#676767] disabled:text-[#3a3a3a] enabled:hover:bg-neutral-200"
            aria-label="Send message"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" class="h-4 w-4">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="text-center text-[11px] sm:text-xs text-muted mt-2 sm:mt-2.5 px-2">Assistant can make mistakes. Check important info.</p>
      </form>
    </footer>
  </div>

  <script src="./script.js"></script>
</body>
</html>
